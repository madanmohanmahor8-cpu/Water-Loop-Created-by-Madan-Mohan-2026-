<body>

    <div id="ui-box">
        <div class="score-text">Score: <span id="score">0</span> | Best: <span id="best">0</span></div>
        <div class="level-text">Level: <span id="level">1</span></div>
        <div id="msg">Tap anywhere to match the water color!</div>
    </div>
    
    <canvas id="gameCanvas" width="340" height="340"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const levelEl = document.getElementById('level');
        const msgEl = document.getElementById('msg');

        const colors = ['#00f2fe', '#ff0844', '#ffb199', '#fdbb2d'];
        let ringAngle = 0;
        let currentColorIndex = 0;
        let score = 0;
        let level = 1;
        let highScore = localStorage.getItem('mm_symm_highscore') || 0;
        bestEl.innerText = highScore;

        let ballRadius = 0;
        let maxBallRadius = 100; // सिमेट्री मैच पॉइंट
        let baseSpeed = 1.0;     // धीमी व स्मूथ स्पीड
        let speed = baseSpeed;
        let isGameOver = false;
        let particles = [];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, duration, type = 'sine') {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 2,
                    color: color,
                    alpha: 1
                });
            }
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--baseSpeed; isGameOver = false;
                scoreEl.innerText = score;
                levelEl.innerText = level;
                msgEl.innerText = "Tap anywhere to match the water color!";
                resetBall();
                update();
            } else {
                ringAngle += Math.PI / 2;
                playSound(420, 0.04);
            }
        }

        window.addEventListener('click', handleTap);
        resetBall();
        update();
    </script>
