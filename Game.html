!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Big Ring Water Loop - Madan Mohan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #09121d;
            color: #fff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            padding: 20px 10px;
        }
        #ui-box { text-align: center; z-index: 10; }
        .score-text { font-size: 28px; font-weight: 800; color: #00f2fe; text-shadow: 0 0 12px rgba(0, 242, 254, 0.5); }
        .level-text { font-size: 18px; color: #ff0844; margin-top: 4px; font-weight: 700; }
        #msg { font-size: 15px; color: #a0b0c0; margin-top: 6px; }
        #canvas-container { 
            flex-grow: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 100%; 
        }
        canvas { 
            background: transparent; 
            cursor: pointer;
            touch-action: manipulation;
        }
        #creator-tag { 
            font-size: 14px; 
            color: #00f2fe; 
            letter-spacing: 2px; 
            font-weight: 700; 
            text-transform: uppercase; 
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ui-box">
        <div class="score-text">Score: <span id="score">0</span> | Best: <span id="best">0</span></div>
        <div class="level-text">Level: <span id="level">1</span></div>
        <div id="msg">Tap anywhere to match the water color!</div>
    </div>
    
    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="creator-tag">Created by Madan Mohan (2026)</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const levelEl = document.getElementById('level');
        const msgEl = document.getElementById('msg');

        let size = 350;
        function resizeCanvas() {
            const maxW = container.clientWidth * 0.98;
            const maxH = container.clientHeight * 0.98;
            // कैनवास को स्क्रीन के हिसाब से अधिकतम बड़ा (550px तक) किया गया है
            size = Math.min(maxW, maxH, 550); 
            canvas.width = size;
            canvas.height = size;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const colors = ['#00f2fe', '#ff0844', '#ffb199', '#fdbb2d'];
        let ringAngle = 0;
        let currentColorIndex = 0;
        let score = 0;
        let level = 1;
        let highScore = localStorage.getItem('mm_bigring_highscore') || 0;
        bestEl.innerText = highScore;

        let ballProgress = 0;
        let baseSpeed = 0.0075; // धीमी व आसान स्पीड
        let speed = baseSpeed;
        let isGameOver = false;
        let particles = [];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, duration, type = 'sine') {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * (size * 0.02),
                    vy: (Math.random() - 0.5) * (size * 0.02),
                    radius: Math.random() * (size * 0.01) + 2,
                    color: color,
                    alpha: 1
                });
            }
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.restore();

                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        function drawRing() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = size * 0.40; // बहुत बड़ा गोल घेरा
            const sliceAngle = (Math.PI * 2) / 4;
            const lineWidth = size * 0.12; // काफी मोटी और मजबूत दिखने वाली रिंग

            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, ringAngle + i * sliceAngle, ringAngle + (i + 1) * sliceAngle);
                ctx.lineWidth = lineWidth;
                ctx.strokeStyle = colors[i];
                ctx.shadowBlur = size * 0.04;
                ctx.shadowColor = colors[i];
                ctx.stroke();
            }
            ctx.shadowBlur = 0;
        }

        function drawWaterBall() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            // बॉल को छोटा रखा गया है (रिंग के मुकाबले 0.28 अनुपात)
            const maxRadius = size * 0.28; 
            const currentRadius = ballProgress * maxRadius;

            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, currentRadius, 0, Math.PI * 2);
            ctx.fillStyle = colors[currentColorIndex];
            ctx.shadowBlur = size * 0.03;
            ctx.shadowColor = colors[currentColorIndex];
            ctx.fill();

            if (currentRadius > 6) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, Math.max(0, currentRadius - size * 0.02), 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.fill();
            }
            ctx.restore();
        }

        function getBottomColorIndex() {
            let normalizedAngle = (ringAngle % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
            let activeIndex = Math.floor(((2 * Math.PI - normalizedAngle) % (Math.PI * 2)) / (Math.PI / 2));
            return (activeIndex + 1) % 4;
        }

        function resetBall() {
            ballProgress = 0;
            currentColorIndex = Math.floor(Math.random() * 4);
        }

        function update() {
            if (isGameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ballProgress += speed;

            if (ballProgress >= 1.0) {
                if (currentColorIndex === getBottomColorIndex()) {
                    score += 1;
                    scoreEl.innerText = score;
                    
                    level = Math.floor(score / 5) + 1;
                    levelEl.innerText = level;

                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('mm_bigring_highscore', highScore);
                        bestEl.innerText = highScore;
                    }

                    speed = baseSpeed + (level - 1) * 0.001;

                    createParticles(canvas.width / 2, canvas.height / 2 + size * 0.35, colors[currentColorIndex]);
                    playSound(600, 0.08);
                    resetBall();
                } else {
                    isGameOver = true;
                    playSound(180, 0.4, 'sawtooth');
                    msgEl.innerHTML = "<b style='color:#ff0844;'>GAME OVER! Tap to try again</b>";
                }
            }

            drawRing();
            drawWaterBall();
            drawParticles();
            requestAnimationFrame(update);
        }

        function handleTap() {
            if (isGameOver) {
                score = 0; level = 1; speed = baseSpeed; isGameOver = false;
                scoreEl.innerText = score;
                levelEl.innerText = level;
                msgEl.innerText = "Tap anywhere to match the water color!";
                resetBall();
                update();
            } else {
                ringAngle += Math.PI / 2;
                playSound(420, 0.04);
            }
        }

        window.addEventListener('pointerdown', handleTap);
        resetBall();
        update();
    </script>
</body>
</html>
